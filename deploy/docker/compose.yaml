name: sdlink
services:
  sdlink:
    image: ${SDLINK_IMAGE:?Set SDLINK_IMAGE to the built immutable image tag}
    network_mode: host
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "10001:10001"
    pids_limit: 256
    stop_grace_period: 30s
    env_file: [sdlink.env]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - ./config.yaml:/etc/sdlink/config.yaml:ro
      - ./data:/var/lib/sdlink
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
